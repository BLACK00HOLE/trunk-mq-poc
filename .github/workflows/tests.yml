name: Test Suite

# Gate for the merge queue. pull_request covers BOTH developer PRs and Trunk's
# internal speculative PRs (trunk-merge/*), so we don't also listen on push -
# that would double-run every commit. main isn't re-tested after merge (it was
# already validated on the speculative branch).
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch instead of piling them up.
concurrency:
  group: test-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run dummy test suite
        run: bash tests/run-tests.sh

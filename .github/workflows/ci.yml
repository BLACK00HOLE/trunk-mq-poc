name: CI

# pull_request covers both developer PRs and Trunk's internal speculative PRs,
# so we don't also listen on push (which would double-run every commit).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run POC gate
        run: bash ./check.sh
